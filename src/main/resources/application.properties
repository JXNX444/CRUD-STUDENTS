# ============================================================
#  Hoja de trabajo 1 - CRUD Estudiantes
#  Conexion a PostgreSQL LOCAL
# ============================================================

spring.application.name=demo

# ---- Conexion a la base de datos ----
# Formato: jdbc:postgresql://SERVIDOR:PUERTO/NOMBRE_BASE?currentSchema=ESQUEMA
spring.datasource.url=jdbc:postgresql://localhost:5432/crud_postgres?currentSchema=academico
spring.datasource.username=postgres
# La contrasena ya NO va en el codigo: se lee de una variable de entorno.
spring.datasource.password=${DB_PASSWORD}

# ---- JPA / Hibernate ----
# none = Hibernate NO intenta crear ni validar tablas (la tabla ya existe).
spring.jpa.hibernate.ddl-auto=none
# Muestra en consola el SQL que ejecuta (util para aprender / depurar).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ============================================================
#  Correo (Gmail SMTP)
#  La contrasena NO es la de tu Gmail: es una "Contrasena de aplicacion".
#  Se saca en https://myaccount.google.com/apppasswords (con verificacion en 2 pasos).
#  Ahora el usuario y la contrasena se leen de variables de entorno.
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Mostrar el mensaje real en las respuestas de error (para el front)
server.error.include-message=always`