<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#F5F2EC; --ink:#16302B; --muted:#6C7B74;
            --teal:#1F7A6D; --teal-dark:#155D53;
            --card:#FFFFFF; --line:#E4DFD4; --danger:#B4442F;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{
            font-family:'Inter',system-ui,sans-serif;
            background:var(--bg); color:var(--ink);
            min-height:100vh; display:grid; place-items:center; padding:20px;
        }
        .card{
            background:var(--card); border:1px solid var(--line);
            border-radius:16px; padding:32px; width:100%; max-width:360px;
        }
        .eyebrow{
            font-size:12px; letter-spacing:.14em; text-transform:uppercase;
            color:var(--teal); font-weight:600; margin-bottom:8px;
        }
        h1{
            font-family:'Fraunces',serif; font-weight:600;
            font-size:28px; margin-bottom:24px;
        }
        label{display:block; font-size:13px; font-weight:500; margin-bottom:6px}
        .field{margin-bottom:16px}
        input{
            width:100%; padding:11px 13px; font:inherit; font-size:14px;
            border:1px solid var(--line); border-radius:9px; background:#FCFBF8;
            color:var(--ink);
        }
        input:focus{
            outline:none; border-color:var(--teal);
            box-shadow:0 0 0 3px rgba(31,122,109,.14);
        }
        button{
            width:100%; margin-top:8px; padding:12px; border-radius:9px; border:none;
            background:var(--teal); color:#fff; font:inherit; font-weight:600; font-size:15px;
            cursor:pointer;
        }
        button:hover{background:var(--teal-dark)}
        .error{
            color:var(--danger); font-size:13px; margin-top:14px; text-align:center;
            display:none;
        }
        .error.show{display:block}
    </style>
</head>
<body>
<div class="card">
    <div class="eyebrow">Registro de Estudiantes</div>
    <h1>Iniciar sesión</h1>

    <div class="field">
        <label for="username">Usuario</label>
        <input type="text" id="username" autocomplete="username">
    </div>
    <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password">
    </div>
    <button id="btn">Entrar</button>
    <div class="error" id="error">Usuario o contraseña incorrectos</div>
</div>

<script>
    const btn = document.getElementById('btn');
    const errorBox = document.getElementById('error');

    async function entrar() {
        errorBox.classList.remove('show');
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (res.ok) {
                window.location.href = '/';
            } else {
                errorBox.classList.add('show');
            }
        } catch (e) {
            errorBox.classList.add('show');
        }
    }

    btn.addEventListener('click', entrar);
    document.getElementById('password').addEventListener('keydown', e => {
        if (e.key === 'Enter') entrar();
    });
</script>
</body>
</html>
