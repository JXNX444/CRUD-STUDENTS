<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/estilos.css">
</head>
<body>
<div class="login-wrap">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>

    <div class="login-card">
        <div class="book-logo lg">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="oklch(78% 0.14 145)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5c-2.6-1.5-5.6-1.7-8-.6v13.6c2.4-1.1 5.4-.9 8 .6z"></path><path d="M12 5c2.6-1.5 5.6-1.7 8-.6v13.6c-2.4-1.1-5.4-.9-8 .6z"></path><line x1="12" y1="5" x2="12" y2="18.6"></line></svg>
        </div>
        <div class="eyebrow">Registro de Estudiantes</div>
        <h1>Bienvenido de nuevo</h1>

        <div class="field">
            <label for="username">Usuario</label>
            <div class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"></circle><path d="M4.5 20c0-4 3.3-6.4 7.5-6.4s7.5 2.4 7.5 6.4"></path></svg>
                <input type="text" id="username" autocomplete="username">
            </div>
        </div>
        <div class="field">
            <label for="password">Contraseña</label>
            <div class="input-icon password-wrap">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
                <input type="password" id="password" autocomplete="current-password">
                <button type="button" class="eye-toggle" id="btnEye">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="9" ry="5.2"></ellipse><circle cx="12" cy="12" r="2.4"></circle></svg>
                </button>
            </div>
        </div>
        <button class="btn-primary" id="btn">Entrar</button>
        <div class="error-msg" id="error">Usuario o contraseña incorrectos</div>
    </div>
</div>

<script>
    const btn = document.getElementById('btn');
    const errorBox = document.getElementById('error');
    const passInput = document.getElementById('password');

    document.getElementById('btnEye').addEventListener('click', () => {
        passInput.type = passInput.type === 'password' ? 'text' : 'password';
    });

    async function entrar() {
        errorBox.classList.remove('show');
        const username = document.getElementById('username').value.trim();
        const password = passInput.value;

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (res.ok) {
                window.location.href = '/';
            } else {
                errorBox.classList.add('show');
            }
        } catch (e) {
            errorBox.classList.add('show');
        }
    }

    btn.addEventListener('click', entrar);
    passInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') entrar();
    });
</script>
</body>
</html>
