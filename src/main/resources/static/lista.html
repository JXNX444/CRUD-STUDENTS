<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de estudiantes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/estilos.css">
</head>
<body>
<div class="shell">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="book-logo sm">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="oklch(85% 0.13 145)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5c-2.6-1.5-5.6-1.7-8-.6v13.6c2.4-1.1 5.4-.9 8 .6z"></path><path d="M12 5c2.6-1.5 5.6-1.7 8-.6v13.6c-2.4-1.1-5.4-.9-8 .6z"></path><line x1="12" y1="5" x2="12" y2="18.6"></line></svg>
            </div>
            <div class="brand-name">Kampus</div>
        </div>
        <nav class="sidebar-nav">
            <a href="/estudiantes.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M2.5 20c0-3.4 2.9-5.6 6.5-5.6s6.5 2.2 6.5 5.6"></path><line x1="18.5" y1="7.5" x2="18.5" y2="13.5"></line><line x1="15.5" y1="10.5" x2="21.5" y2="10.5"></line></svg>Registrar</a>
            <a href="/lista.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="4.2" cy="6" r="1"></circle><circle cx="4.2" cy="12" r="1"></circle><circle cx="4.2" cy="18" r="1"></circle><line x1="9" y1="6" x2="21" y2="6"></line><line x1="9" y1="12" x2="21" y2="12"></line><line x1="9" y1="18" x2="21" y2="18"></line></svg>Lista</a>
            <a href="/asignaciones.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5c2.6-1.3 5.2-1.3 7 0v13c-1.8-1.3-4.4-1.3-7 0z"></path><path d="M20 5.5c-2.6-1.3-5.2-1.3-7 0v13c1.8-1.3 4.4-1.3 7 0z"></path></svg>Asignar cursos</a>
            <a href="/reporte.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><line x1="8" y1="8" x2="16" y2="8"></line><line x1="8" y1="12" x2="16" y2="12"></line><line x1="8" y1="16" x2="13" y2="16"></line></svg>Reporte</a>
        </nav>
        <div class="sidebar-spacer"></div>
        <button class="btn-logout" onclick="cerrarSesion()">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5.5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2H9"></path><line x1="14.5" y1="12" x2="21" y2="12"></line><path d="M17.5 8.5l3.5 3.5-3.5 3.5"></path></svg>
            Cerrar sesión
        </button>
    </aside>

    <main class="content">
        <div class="screen">
            <div class="eyebrow">Hoja de trabajo 1 · CRUD</div>
            <div class="list-head">
                <h1 style="margin:0">Lista de <em>estudiantes</em></h1>
                <span class="count" id="count">—</span>
            </div>
            <div class="row-card" id="tabla"></div>
        </div>
    </main>
</div>

<div id="toast"><span class="check">✓</span><span id="toastMsg"></span></div>

<script src="/comun.js"></script>
<script>
    const API = '/api/estudiantes';

    function iniciales(nombre){
        const p = nombre.trim().split(/\s+/);
        return ((p[0]||'')[0] + (p[1]||'')[0]).toUpperCase();
    }

    async function cargar(){
        try{
            const res = await apiFetch(API);
            const data = await res.json();
            document.getElementById('count').textContent = data.length + (data.length===1?' estudiante':' estudiantes');
            const cont = document.getElementById('tabla');
            if(data.length === 0){ cont.innerHTML = '<div class="empty">Todav\u00eda no hay estudiantes.<br>Registr\u00e1 el primero en la p\u00e1gina Registrar.</div>'; return; }
            cont.innerHTML = data.map(e => `
      <div class="row-list">
        <div class="avatar">${escapar(iniciales(e.nombreCompleto))}</div>
        <div style="flex:1;min-width:0">
          <div class="row-name">${escapar(e.nombreCompleto)}</div>
          <div class="row-correo">${escapar(e.correo)}</div>
        </div>
        <div class="row-carnet">${escapar(e.carnet)}</div>
        <div class="pill">${escapar(e.carrera)}</div>
        <button class="btn-del" onclick="eliminar(${e.id}, '${escapar(e.nombreCompleto)}')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"></line><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"></path><path d="M9.5 7V4.5h5V7"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
        </button>
      </div>`).join('');
        }catch(err){ document.getElementById('tabla').innerHTML = '<div class="empty">No se pudo cargar la lista.</div>'; }
    }

    async function eliminar(id, nombre){
        if(!confirm('\u00bfEliminar a ' + nombre + '? (baja l\u00f3gica)')) return;
        try{
            const res = await apiFetch(API + '/' + id, { method:'DELETE' });
            if(res.ok){ toast('Estudiante eliminado'); cargar(); }
            else { toast('No se pudo eliminar.', true); }
        }catch(err){ toast('Error de conexi\u00f3n con el servidor.', true); }
    }
    cargar();
</script>
</body>
</html>
