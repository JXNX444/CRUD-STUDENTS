<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar estudiante</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/estilos.css">
</head>
<body>
<div class="shell">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="book-logo sm">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="oklch(85% 0.13 145)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5c-2.6-1.5-5.6-1.7-8-.6v13.6c2.4-1.1 5.4-.9 8 .6z"></path><path d="M12 5c2.6-1.5 5.6-1.7 8-.6v13.6c-2.4-1.1-5.4-.9-8 .6z"></path><line x1="12" y1="5" x2="12" y2="18.6"></line></svg>
            </div>
            <div class="brand-name">Kampus</div>
        </div>
        <nav class="sidebar-nav">
            <a href="/estudiantes.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M2.5 20c0-3.4 2.9-5.6 6.5-5.6s6.5 2.2 6.5 5.6"></path><line x1="18.5" y1="7.5" x2="18.5" y2="13.5"></line><line x1="15.5" y1="10.5" x2="21.5" y2="10.5"></line></svg>Registrar</a>
            <a href="/lista.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="4.2" cy="6" r="1"></circle><circle cx="4.2" cy="12" r="1"></circle><circle cx="4.2" cy="18" r="1"></circle><line x1="9" y1="6" x2="21" y2="6"></line><line x1="9" y1="12" x2="21" y2="12"></line><line x1="9" y1="18" x2="21" y2="18"></line></svg>Lista</a>
            <a href="/asignaciones.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5c2.6-1.3 5.2-1.3 7 0v13c-1.8-1.3-4.4-1.3-7 0z"></path><path d="M20 5.5c-2.6-1.3-5.2-1.3-7 0v13c1.8-1.3 4.4-1.3 7 0z"></path></svg>Asignar cursos</a>
        </nav>
        <div class="sidebar-spacer"></div>
        <button class="btn-logout" onclick="cerrarSesion()">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5.5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2H9"></path><line x1="14.5" y1="12" x2="21" y2="12"></line><path d="M17.5 8.5l3.5 3.5-3.5 3.5"></path></svg>
            Cerrar sesión
        </button>
    </aside>

    <main class="content">
        <div class="screen">
            <div class="eyebrow">Hoja de trabajo 1 · CRUD</div>
            <h1>Registrar <em>estudiante</em></h1>

            <div class="card" style="max-width:520px">
                <div class="card-head">
                    <div class="card-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M2.5 20c0-3.4 2.9-5.6 6.5-5.6s6.5 2.2 6.5 5.6"></path><line x1="18.5" y1="7.5" x2="18.5" y2="13.5"></line><line x1="15.5" y1="10.5" x2="21.5" y2="10.5"></line></svg>
                    </div>
                    <h2>Nuevo estudiante</h2>
                </div>

                <div class="field-row">
                    <div class="field" style="margin-bottom:0">
                        <label for="carnet">Carné</label>
                        <div class="input-icon">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"></rect><circle cx="8" cy="12" r="1.8"></circle><line x1="13" y1="10" x2="18" y2="10"></line><line x1="13" y1="14" x2="16.5" y2="14"></line></svg>
                            <input id="carnet" inputmode="numeric" placeholder="2024001">
                        </div>
                        <div class="hint">Solo dígitos, de 6 a 20.</div>
                    </div>
                    <div class="field" style="margin-bottom:0">
                        <label for="telefono">Teléfono</label>
                        <input id="telefono" inputmode="numeric" placeholder="55551234">
                        <div class="hint">Exactamente 8 dígitos (opcional).</div>
                    </div>
                </div>

                <div class="field">
                    <label for="nombre">Nombre completo</label>
                    <input id="nombre" placeholder="Juan Pérez">
                </div>

                <div class="field">
                    <label for="correo">Correo</label>
                    <div class="input-icon">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
                        <input id="correo" type="email" placeholder="juan@umg.edu.gt">
                    </div>
                </div>

                <div class="field">
                    <label for="carrera">Carrera</label>
                    <div class="input-icon">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l9 4-9 4-9-4 9-4z"></path><path d="M6 9.5v5c0 1.6 3 3 6 3s6-1.4 6-3v-5"></path></svg>
                        <select id="carrera">
                            <option value="">Cargando carreras…</option>
                        </select>
                    </div>
                    <div class="hint">Seleccioná una carrera de la lista.</div>
                </div>

                <button class="btn-primary" id="btnGuardar" onclick="registrar()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Registrar estudiante
                </button>
            </div>
        </div>
    </main>
</div>

<div id="toast"><span class="check">✓</span><span id="toastMsg"></span></div>

<script src="/comun.js"></script>
<script>
    const API = '/api/estudiantes';
    const API_CARRERAS = '/api/carreras';

    async function cargarCarreras(){
        const sel = document.getElementById('carrera');
        try{
            const res = await apiFetch(API_CARRERAS);
            const carreras = await res.json();
            sel.innerHTML = '<option value="">Seleccion\u00e1 una carrera</option>' +
                carreras.map(c => `<option value="${escapar(c.nombre)}">${escapar(c.nombre)}</option>`).join('');
        }catch(err){ sel.innerHTML = '<option value="">No se pudo cargar el cat\u00e1logo</option>'; }
    }

    async function registrar(){
        const estudiante = {
            carnet: val('carnet'), nombreCompleto: val('nombre'),
            correo: val('correo'), telefono: val('telefono') || null, carrera: val('carrera')
        };
        if(!estudiante.carnet || !estudiante.nombreCompleto || !estudiante.correo || !estudiante.carrera){
            toast('Complet\u00e1 carn\u00e9, nombre, correo y carrera.', true); return;
        }
        const btn = document.getElementById('btnGuardar'); btn.disabled = true;
        try{
            const res = await apiFetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(estudiante) });
            if(res.ok){ toast('Estudiante registrado'); limpiar(); }
            else if(res.status === 409 || res.status === 500){ toast('Ese carn\u00e9 o correo ya existe.', true); }
            else { toast('No se pudo registrar (revis\u00e1 los datos).', true); }
        }catch(err){ toast('Error de conexi\u00f3n con el servidor.', true); }
        finally{ btn.disabled = false; }
    }

    function limpiar(){ ['carnet','nombre','correo','telefono','carrera'].forEach(id => document.getElementById(id).value=''); }

    document.querySelectorAll('input').forEach(inp => inp.addEventListener('keydown', e => { if(e.key === 'Enter') registrar(); }));
    cargarCarreras();
</script>
</body>
</html>
