<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de estudiantes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/estilos.css">
</head>
<body>
<div class="shell">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="book-logo sm">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="oklch(85% 0.13 145)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5c-2.6-1.5-5.6-1.7-8-.6v13.6c2.4-1.1 5.4-.9 8 .6z"></path><path d="M12 5c2.6-1.5 5.6-1.7 8-.6v13.6c-2.4-1.1-5.4-.9-8 .6z"></path><line x1="12" y1="5" x2="12" y2="18.6"></line></svg>
            </div>
            <div class="brand-name">Kampus</div>
        </div>
        <nav class="sidebar-nav">
            <a href="/estudiantes.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M2.5 20c0-3.4 2.9-5.6 6.5-5.6s6.5 2.2 6.5 5.6"></path><line x1="18.5" y1="7.5" x2="18.5" y2="13.5"></line><line x1="15.5" y1="10.5" x2="21.5" y2="10.5"></line></svg>Registrar</a>
            <a href="/lista.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="4.2" cy="6" r="1"></circle><circle cx="4.2" cy="12" r="1"></circle><circle cx="4.2" cy="18" r="1"></circle><line x1="9" y1="6" x2="21" y2="6"></line><line x1="9" y1="12" x2="21" y2="12"></line><line x1="9" y1="18" x2="21" y2="18"></line></svg>Lista</a>
            <a href="/asignaciones.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5c2.6-1.3 5.2-1.3 7 0v13c-1.8-1.3-4.4-1.3-7 0z"></path><path d="M20 5.5c-2.6-1.3-5.2-1.3-7 0v13c1.8-1.3 4.4-1.3 7 0z"></path></svg>Asignar cursos</a>
            <a href="/reporte.html" class="activo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><line x1="8" y1="8" x2="16" y2="8"></line><line x1="8" y1="12" x2="16" y2="12"></line><line x1="8" y1="16" x2="13" y2="16"></line></svg>Reporte</a>
        </nav>
        <div class="sidebar-spacer"></div>
        <button class="btn-logout" onclick="cerrarSesion()">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5.5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2H9"></path><line x1="14.5" y1="12" x2="21" y2="12"></line><path d="M17.5 8.5l3.5 3.5-3.5 3.5"></path></svg>
            Cerrar sesión
        </button>
    </aside>

    <main class="content">
        <div class="screen">
            <div class="eyebrow">Hoja de trabajo 1 · CRUD</div>
            <h1>Reporte de <em>estudiantes</em></h1>

            <div class="card" style="max-width:760px">
                <div class="card-head">
                    <div class="card-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><line x1="8" y1="8" x2="16" y2="8"></line><line x1="8" y1="12" x2="16" y2="12"></line><line x1="8" y1="16" x2="13" y2="16"></line></svg>
                    </div>
                    <h2>Filtros (obligatorios)</h2>
                </div>

                <div class="field">
                    <label for="facultad">Facultad</label>
                    <div class="input-icon">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l9 4-9 4-9-4 9-4z"></path><path d="M6 9.5v5c0 1.6 3 3 6 3s6-1.4 6-3v-5"></path></svg>
                        <select id="facultad">
                            <option value="">Seleccioná una facultad</option>
                            <option value="INGENIERIA">Ingeniería</option>
                            <option value="CIENCIAS_MEDICAS">Ciencias Médicas</option>
                            <option value="CIENCIAS_JURIDICAS">Ciencias Jurídicas</option>
                            <option value="CIENCIAS_ECONOMICAS">Ciencias Económicas</option>
                            <option value="CIENCIAS_ADMINISTRATIVAS">Ciencias Administrativas</option>
                            <option value="HUMANIDADES">Humanidades</option>
                        </select>
                    </div>
                </div>

                <div class="field-row">
                    <div class="field" style="margin-bottom:0">
                        <label for="inicio">Fecha inicio</label>
                        <input id="inicio" type="date">
                    </div>
                    <div class="field" style="margin-bottom:0">
                        <label for="fin">Fecha fin</label>
                        <input id="fin" type="date">
                    </div>
                </div>
                <div class="hint">El rango no puede pasar de 6 meses.</div>

                <button class="btn-primary" id="btnGenerar" onclick="generar()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16" y2="16"></line></svg>
                    Generar reporte
                </button>
            </div>

            <div class="list-head" style="margin-top:26px">
                <h2 style="margin:0">Resultados</h2>
                <span class="count" id="count">—</span>
            </div>
            <div class="row-card" id="tabla"><div class="empty">Elegí los filtros y generá el reporte.</div></div>

            <div id="paginador" style="display:none;align-items:center;justify-content:center;gap:16px;margin-top:18px">
                <button id="btnAnterior" onclick="irPagina(paginaActual - 1)" style="padding:9px 16px;border-radius:10px;border:1px solid oklch(85% 0.02 145);background:#fff;cursor:pointer;font:inherit;font-weight:600">‹ Anterior</button>
                <span id="infoPagina" style="font-weight:600;color:oklch(45% 0.02 145)"></span>
                <button id="btnSiguiente" onclick="irPagina(paginaActual + 1)" style="padding:9px 16px;border-radius:10px;border:1px solid oklch(85% 0.02 145);background:#fff;cursor:pointer;font:inherit;font-weight:600">Siguiente ›</button>
            </div>
        </div>
    </main>
</div>

<div id="toast"><span class="check">✓</span><span id="toastMsg"></span></div>

<script src="/comun.js"></script>
<script>
    const API = '/api/estudiantes/reporte';
    const TAMANO = 10;

    const NOMBRE_FAC = {
        INGENIERIA:'Ingeniería', CIENCIAS_MEDICAS:'Ciencias Médicas',
        CIENCIAS_JURIDICAS:'Ciencias Jurídicas', CIENCIAS_ECONOMICAS:'Ciencias Económicas',
        CIENCIAS_ADMINISTRATIVAS:'Ciencias Administrativas', HUMANIDADES:'Humanidades'
    };

    let filtros = null;      // guarda facultad/inicio/fin del último "Generar"
    let paginaActual = 0;
    let totalPaginas = 0;

    function generar(){
        const facultad = val('facultad');
        const inicio = val('inicio');
        const fin = val('fin');

        if(!facultad || !inicio || !fin){ toast('Eleg\u00ed facultad, fecha inicio y fecha fin.', true); return; }
        const dIni = new Date(inicio), dFin = new Date(fin);
        if(dIni > dFin){ toast('La fecha inicio no puede ser mayor que la fin.', true); return; }
        const limite = new Date(dIni); limite.setMonth(limite.getMonth() + 6);
        if(dFin > limite){ toast('El rango no puede pasar de 6 meses.', true); return; }

        filtros = { facultad, inicio, fin };
        irPagina(0);
    }

    async function irPagina(p){
        if(!filtros) return;
        if(p < 0 || (totalPaginas > 0 && p >= totalPaginas)) return;

        const btn = document.getElementById('btnGenerar'); btn.disabled = true;
        try{
            const url = `${API}?facultad=${encodeURIComponent(filtros.facultad)}&inicio=${filtros.inicio}&fin=${filtros.fin}&pagina=${p}&tamano=${TAMANO}`;
            const res = await apiFetch(url);
            if(!res.ok){ toast('No se pudo generar el reporte.', true); return; }
            const page = await res.json();
            paginaActual = page.number;
            totalPaginas = page.totalPages;
            render(page);
        }catch(err){ toast('Error de conexi\u00f3n con el servidor.', true); }
        finally{ btn.disabled = false; }
    }

    function render(page){
        const data = page.content;
        document.getElementById('count').textContent = page.totalElements + (page.totalElements === 1 ? ' estudiante' : ' estudiantes');
        const cont = document.getElementById('tabla');
        const pag = document.getElementById('paginador');

        if(page.totalElements === 0){
            cont.innerHTML = '<div class="empty">No hay estudiantes con esos filtros.</div>';
            pag.style.display = 'none';
            return;
        }

        cont.innerHTML = data.map(e => `
      <div class="row-list">
        <div style="flex:1;min-width:0">
          <div class="row-name">${escapar(e.nombreCompleto)}</div>
          <div class="row-correo">${escapar(e.correo)}</div>
        </div>
        <div class="row-carnet">${escapar(e.carnet)}</div>
        <div class="pill">${escapar(NOMBRE_FAC[e.facultad] || e.facultad)}</div>
        <div class="row-carnet">${escapar(e.fechaIngreso)}</div>
      </div>`).join('');

        document.getElementById('infoPagina').textContent = `Página ${paginaActual + 1} de ${totalPaginas}`;
        document.getElementById('btnAnterior').disabled = page.first;
        document.getElementById('btnSiguiente').disabled = page.last;
        pag.style.display = 'flex';
    }
</script>
</body>
</html>
